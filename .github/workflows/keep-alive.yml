# Keeps the backend awake on Render's free plan.
# Free services go to sleep after 15 minutes without requests, and waking them up takes about a
# minute (and sometimes doesn't happen at all). Calling the API every 10 minutes keeps it running;
# one always-on free service uses ~730 of the 750 free hours a month.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the API
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://hsrwiki-backend.onrender.com/api/version || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::warning::The backend did not answer with 200"
