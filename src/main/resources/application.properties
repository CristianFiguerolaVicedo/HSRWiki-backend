spring.application.name=hsrwiki

# Hosting services (Render...) say which port to use through PORT; 8080 locally
server.port=${PORT:8080}

# Game data generated by data-pipeline/update_data.py (override with file:/path/to/game_data.json)
hsrwiki.data-file=classpath:data/game_data.json
hsrwiki.builds-file=classpath:data/character_builds.json

# Frontend origins allowed to call the API (comma separated)
hsrwiki.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# Public player showcase by UID (Enka.Network). No HoYoverse login involved.
hsrwiki.enka.base-url=https://enka.network/api/hsr/uid
hsrwiki.enka.user-agent=HSRWiki/1.0 (+https://github.com/CristianFiguerolaVicedo/HSRWiki-backend)
hsrwiki.showcase-lookup-file=classpath:data/showcase_lookup.json
