spring.application.name=hsrwiki

# Game data generated by data-pipeline/update_data.py (override with file:/path/to/game_data.json)
hsrwiki.data-file=classpath:data/game_data.json
hsrwiki.builds-file=classpath:data/character_builds.json

# Frontend origins allowed to call the API (comma separated)
hsrwiki.cors.allowed-origins=http://localhost:5173,http://localhost:4173
